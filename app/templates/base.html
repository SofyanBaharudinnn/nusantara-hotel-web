<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Nusantara Hospitality Group{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff4d4d'/%3E%3Cstop offset='100%25' stop-color='%23dc2626'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='50%25' y='67%25' font-size='50' font-weight='800' fill='white' font-family='Segoe UI, sans-serif' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <style>
    /* ================= PRELOADER LOADING SCREEN ================= */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #070707;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
      visibility: visible;
    }

    #preloader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .preloader-spinner-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .preloader-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d4d, #dc2626);
      box-shadow: 0 0 24px rgba(220, 38, 38, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 22px;
      font-family: 'Segoe UI', sans-serif;
      animation: logoPulse 1.8s ease-in-out infinite;
      z-index: 2;
    }

    .preloader-spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 255, 255, 0.03);
      border-top: 3px solid #ff4d4d;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
      z-index: 1;
    }

    .preloader-text {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 12px;
      opacity: 0.8;
      animation: pulseText 1.8s ease-in-out infinite;
    }

    body.preloader-active {
      overflow: hidden !important;
      height: 100vh !important;
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 24px rgba(220, 38, 38, 0.6);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 36px rgba(220, 38, 38, 0.9);
      }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- PRELOADER -->
  <div id="preloader">
    <div class="preloader-spinner-wrap">
      <div class="preloader-logo">N</div>
      <div class="preloader-spinner"></div>
    </div>
    <div class="preloader-text">Nusantara Hospitality</div>
  </div>
  <script>
    document.body.classList.add('preloader-active');
    
    (function() {
      var preloaderStartTime = Date.now();
      var minPreloaderTime = 800; // Enforce minimum 800ms loading display for visual smoothness
      var preloaderFaded = false;

      function hidePreloader() {
        if (preloaderFaded) return;
        preloaderFaded = true;

        var loader = document.getElementById('preloader');
        var elapsed = Date.now() - preloaderStartTime;
        var remainingTime = Math.max(0, minPreloaderTime - elapsed);

        setTimeout(function() {
          if (loader) {
            loader.classList.add('fade-out');
          }
          document.body.classList.remove('preloader-active');
          window.dispatchEvent(new CustomEvent('preloaderhide'));
        }, remainingTime);
      }

      window.addEventListener('load', hidePreloader);
      setTimeout(hidePreloader, 2500); // safety fallback in case page resource loading hangs
    })();
  </script>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
